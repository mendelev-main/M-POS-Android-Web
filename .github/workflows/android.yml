name: Android Web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Source parity, transport tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci/setup-sdk.sh
      - name: JS source parity and transport tests
        run: |
          set -o pipefail
          mkdir -p build/ci
          node --test tests/*.test.cjs 2>&1 | tee build/ci/js-tests.log
      - name: Android compilation, tests and lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --max-workers=4 testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Web-test-reports
          path: |
            build/ci/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
  signing:
    name: Permanent signing key preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate independent Web signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MPOS_KEYSTORE_BASE64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
          MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
          MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
          MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
        run: python3 scripts/ci/verify-key.py
  build:
    name: Signed APK
    needs: [tests, signing]
    runs-on: ubuntu-latest
    env:
      MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
      MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
      MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci/setup-sdk.sh
      - run: python3 scripts/ci/version.py
      - name: Load permanent signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MPOS_KEYSTORE_BASE64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
        run: python3 scripts/ci/signing.py
      - name: Build signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: ./gradlew --no-daemon --max-workers=4 assembleRelease
      - name: Verify APK identity, version and certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/ci/verify-apk.py
      - name: Build PR debug APK
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew --no-daemon --max-workers=4 assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: M-POS-Android-Web-${{ env.MPOS_VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.json
            app/build/outputs/apk/release/app-release.sha256
          if-no-files-found: error
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/mpos-release.keystore"
